{{ define "main" }}
<div class="list-page">
  <header class="list-header">
    <h1>Posts tagged "{{ .Title }}"</h1>
  </header>

  <div class="post-list">
    {{ range .Pages }}
    <article class="post-card">
      <div class="post-card-meta">
        <time>{{ .Date.Format "Jan 2, 2006" }}</time>
        {{ range .Params.tags }}<a href="{{ $.Site.BaseURL }}tags/{{ . | urlize }}/" class="tag">{{ . }}</a>{{ end }}
      </div>
      <h2 class="post-card-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p class="post-card-summary">{{ .Summary }}</p>
      <a href="{{ .Permalink }}" class="read-more">Read more →</a>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
